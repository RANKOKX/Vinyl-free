<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sillon</title>
<meta name="theme-color" content="#0b1211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sillon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>

<main id="login" hidden>
  <h1>Sillon</h1>
  <p>Ta musique Spotify sur un vrai vinyle : la pochette du titre en cours devient l'étiquette du disque.</p>
  <button id="go" class="big">Se connecter avec Spotify</button>
  <details id="cfg"><summary>Configuration</summary>
    <label>Client ID Spotify<input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ex. 3f9a…"></label>
    <label>Redirect URI à copier dans Spotify<input id="ruri" readonly></label>
  </details>
</main>

<div id="app" hidden>
  <header>
    <h1>Sillon</h1>
    <nav id="modes" aria-label="Affichage">
      <button data-m="top">Dessus</button><button data-m="3d">3D</button><button data-m="sleeve">Pochette</button>
    </nav>
  </header>

  <div id="deck">
  <div id="stage"><section id="scene" data-mode="top" aria-label="Platine vinyle">
    <div id="tilt"><div id="plinth">
      <div id="shadowl"></div>
      <div id="face"></div>
      <div id="platter"></div>
      <div id="sleeve"></div>
      <div id="rw"><div id="rec"><div id="label"></div></div><div id="sheen"></div></div>
      <div id="base"></div>
      <div id="arm"><i class="cw"></i><i class="bar"></i><i class="head"></i></div>
    </div></div>
  </section></div>

  <section id="meta"><div id="ti">Aucun disque</div><div id="ar">Lance un titre dans Spotify</div></section>
  <div id="seek"><div id="track"><div id="fill"></div></div></div>
  <div id="times"><span id="cu">0:00</span><span id="du">0:00</span></div>

  <div id="ctl">
    <button id="sf" aria-label="Aléatoire"><svg viewBox="0 0 24 24"><path d="M3 7h3c2 0 3.2 1 4.4 2.6l3.2 4.8C14.800 16 16 17 18 17h3M3 17h3c1.300 0 2.300-.5 3.100-1.400M14.900 8.400C15.700 7.500 16.700 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="pv" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zm3.5 7L19 5v14z"/></svg></button>
    <button id="pp" aria-label="Lecture"></button>
    <button id="nx" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5l9.500 7L5 19z"/></svg></button>
    <button id="rp" aria-label="Répéter"><svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <p id="status"><span id="msg"></span> <button id="out">Se déconnecter</button></p>
  </div>

  <div id="lib" hidden>
    <div id="chips"></div>
    <p id="libmsg"></p>
    <div id="pilewrap"><div id="pile"></div></div>
    <div id="pmeta"><div id="pti">Chargement…</div><div id="par"></div><div id="pcount"></div></div>
  </div>

  <nav id="tabs" aria-label="Sections">
    <button data-t="deck" aria-pressed="true">Platine</button><button data-t="lib" aria-pressed="false">Bibliothèque</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
