<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sillon</title>
<meta name="theme-color" content="#1a1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sillon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head><body>

<main id="login" hidden>
  <h1>Sillon</h1>
  <p>Ta musique Spotify sur un vrai vinyle : la pochette du titre en cours devient l'étiquette du disque.</p>
  <button id="go" class="big">Se connecter avec Spotify</button>
  <details id="cfg"><summary>Configuration</summary>
    <label>Client ID Spotify<input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ex. 3f9a…"></label>
    <label>Redirect URI à copier dans Spotify<input id="ruri" readonly></label>
  </details>
</main>

<div id="app" hidden data-tab="deck">

  <div id="deck">
    <div id="stage"><section id="scene" aria-label="Platine vinyle">
      <div id="tilt"><div id="plinth">
        <div id="shadowl"></div>
        <div id="wood"></div>
        <div id="inset"></div>
        <div id="slot"></div>
        <div id="rw"><div id="rec"><div id="label"></div></div><div id="sheen"></div></div>
        <div id="base"></div>
        <div id="arm"><i class="bar"></i><i class="head"></i></div>
      </div></div>
    </section></div>

    <section id="meta"><div id="ti">Aucun disque</div><div id="ar">Lance un titre dans Spotify</div></section>
    <div id="seek"><div id="track"><div id="fill"></div></div></div>
    <div id="times"><span id="cu">0:00</span><span id="du">0:00</span></div>

    <div id="ctl">
      <button id="pp" class="pb"><i></i><span id="ppl">PLAY</span></button>
      <div class="grp">
        <button id="pv" class="pb" aria-label="Précédent"><i></i><span><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zm3.5 7L19 5v14z"/></svg></span></button>
        <button id="nx" class="pb" aria-label="Suivant"><i></i><span><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM5 5l9.5 7L5 19z"/></svg></span></button>
      </div>
    </div>
    <p id="status"><span id="msg"></span></p>
  </div>

  <div id="lib" hidden>
    <div id="libtop">
      <button id="menu" class="rb" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <button id="back" class="rb" aria-label="Retour" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="seg"><button data-s="al">Albums</button><button data-s="pl">Playlists</button></div>
      <div id="lt" hidden></div>
      <input id="sq" type="search" placeholder="Rechercher" autocomplete="off" hidden>
      <button id="sbtn" class="rb" aria-label="Rechercher"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="menupop" hidden><button id="refresh">Recharger</button><button id="out">Se déconnecter</button></div>
    <p id="libmsg"></p>
    <div id="stack"></div>
  </div>

  <nav id="tabs" aria-label="Sections">
    <button data-t="deck" aria-pressed="true">Platine</button><button data-t="lib" aria-pressed="false">Bibliothèque</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
